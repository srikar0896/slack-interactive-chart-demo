<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive chart designed to open inside a Slack message.">
<meta property="og:title" content="Interactive metrics chart">
<meta property="og:description" content="Switch chart types, measures, regions, and time ranges.">
<meta property="og:image" content="https://srikar0896.github.io/slack-interactive-chart-demo/preview.svg">
<title>Interactive metrics chart</title>
<style>
:root{color-scheme:light;--ink:#182c35;--muted:#657782;--line:#dce5e8;--paper:#fff;--wash:#f4f8f8;--teal:#217b78;--blue:#6274c8;--orange:#d48842}
*{box-sizing:border-box}body{margin:0;background:#edf3f4;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #213a4410;overflow:hidden}
header{padding:22px 24px 14px}.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:22px;letter-spacing:-.025em;margin:4px 0 3px}.subtitle{margin:0;color:var(--muted)}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:0 24px 14px}
label{display:grid;gap:5px;color:#526771;font-size:11px;font-weight:700}
select{min-width:125px;border:1px solid var(--line);border-radius:7px;padding:8px 28px 8px 10px;color:var(--ink);background:#fff;font:inherit;font-size:12px}
.range{min-width:150px}.range input{accent-color:var(--teal);width:150px}.range output{color:var(--ink);font-size:11px}
.chart-wrap{padding:0 16px 8px}.chart{display:block;width:100%;height:auto;overflow:visible}
footer{display:flex;justify-content:space-between;gap:12px;padding:11px 24px 15px;border-top:1px solid #edf1f2;color:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:2px 8px 12px 76px;color:#526771;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{width:9px;height:9px;border-radius:50%}
@media(max-width:650px){main{padding:8px}.controls{gap:8px;padding-left:14px;padding-right:14px}header{padding:18px 14px 12px}.chart-wrap{padding:0 5px}footer{padding:10px 14px;flex-direction:column}.range{min-width:125px}.range input{width:125px}}
</style>
</head>
<body>
<main><section class="card" aria-label="Interactive metrics chart">
<header><div class="eyebrow">Live chart · sample data</div><h1>Monthly business metrics</h1><p class="subtitle">Explore the data directly in this Slack embed.</p></header>
<div class="controls">
<label>Chart type<select id="chartType" aria-label="Chart type"><option value="line">Line</option><option value="bar">Grouped bars</option><option value="area">Area</option><option value="scatter">Scatter</option></select></label>
<label>Measure<select id="metric" aria-label="Measure"><option value="active">Active users</option><option value="conversion">Conversion rate</option><option value="revenue">Revenue index</option></select></label>
<label>Region<select id="region" aria-label="Region"><option value="all">All regions</option><option value="north">North</option><option value="south">South</option><option value="west">West</option></select></label>
<label class="range">Months shown <input id="months" aria-label="Months shown" type="range" min="4" max="12" value="12"><output id="monthsLabel">12 months</output></label>
</div>
<div class="chart-wrap"><div id="chart" aria-live="polite"></div><div id="legend" class="legend"></div></div>
<footer><span>Illustrative data · no customer information</span><span>Hover a mark to inspect its value</span></footer>
</section></main>
<script>
const rows=[
{month:"Jan",north:{active:48,conversion:3.2,revenue:43},south:{active:35,conversion:2.6,revenue:31},west:{active:27,conversion:3.8,revenue:26}},
{month:"Feb",north:{active:53,conversion:3.4,revenue:47},south:{active:38,conversion:2.8,revenue:33},west:{active:30,conversion:3.6,revenue:29}},
{month:"Mar",north:{active:57,conversion:3.1,revenue:51},south:{active:41,conversion:3.0,revenue:38},west:{active:31,conversion:4.0,revenue:32}},
{month:"Apr",north:{active:55,conversion:3.7,revenue:53},south:{active:46,conversion:3.1,revenue:40},west:{active:36,conversion:3.9,revenue:35}},
{month:"May",north:{active:62,conversion:3.8,revenue:58},south:{active:47,conversion:3.4,revenue:44},west:{active:39,conversion:4.1,revenue:39}},
{month:"Jun",north:{active:66,conversion:4.0,revenue:63},south:{active:51,conversion:3.6,revenue:47},west:{active:42,conversion:4.3,revenue:44}},
{month:"Jul",north:{active:64,conversion:3.9,revenue:66},south:{active:54,conversion:3.8,revenue:51},west:{active:46,conversion:4.2,revenue:48}},
{month:"Aug",north:{active:72,conversion:4.2,revenue:70},south:{active:57,conversion:3.7,revenue:55},west:{active:49,conversion:4.5,revenue:53}},
{month:"Sep",north:{active:76,conversion:4.4,revenue:75},south:{active:61,conversion:4.0,revenue:58},west:{active:52,conversion:4.6,revenue:57}},
{month:"Oct",north:{active:79,conversion:4.3,revenue:79},south:{active:65,conversion:4.1,revenue:63},west:{active:57,conversion:4.8,revenue:61}},
{month:"Nov",north:{active:85,conversion:4.6,revenue:85},south:{active:69,conversion:4.3,revenue:67},west:{active:61,conversion:4.9,revenue:66}},
{month:"Dec",north:{active:91,conversion:4.8,revenue:92},south:{active:74,conversion:4.5,revenue:72},west:{active:66,conversion:5.1,revenue:71}}
];
const names={north:"North",south:"South",west:"West"};
const colors={north:"#217b78",south:"#6274c8",west:"#d48842"};
const typeEl=document.getElementById("chartType"),metricEl=document.getElementById("metric"),regionEl=document.getElementById("region"),monthsEl=document.getElementById("months");
function render(){
 const count=Number(monthsEl.value), data=rows.slice(rows.length-count), metric=metricEl.value;
 const keys=regionEl.value==="all"?["north","south","west"]:[regionEl.value];
 const values=data.flatMap(d=>keys.map(k=>d[k][metric]));
 const peak=Math.max(...values), step=Math.max(1,Math.ceil(peak/5/10)*10);
 const max=Math.ceil(peak/step)*step, left=68,top=18,width=850,height=302,bottom=top+height;
 const x=i=>left+(data.length===1?width/2:i*width/(data.length-1));
 const y=v=>bottom-(v/max)*height;
 const type=typeEl.value;
 let s='<svg class="chart" viewBox="0 0 960 385" role="img" aria-label="'+metricEl.options[metricEl.selectedIndex].text+' by month">';
 for(let n=0;n<=5;n++){const val=max*n/5,yy=y(val);s+='<line x1="'+left+'" y1="'+yy+'" x2="'+(left+width)+'" y2="'+yy+'" stroke="#e7edef"/><text x="'+(left-12)+'" y="'+(yy+4)+'" text-anchor="end" fill="#73858d" font-size="11">'+(metric==="conversion"?val.toFixed(1):Math.round(val))+(metric==="conversion"?"%":"")+'</text>'}
 s+='<line x1="'+left+'" y1="'+top+'" x2="'+left+'" y2="'+bottom+'" stroke="#cbd7da"/><line x1="'+left+'" y1="'+bottom+'" x2="'+(left+width)+'" y2="'+bottom+'" stroke="#cbd7da"/>';
 const band=width/data.length, barWidth=Math.min(25,band*.62/keys.length);
 if(type==="bar"){
  data.forEach((d,i)=>keys.forEach((k,j)=>{const val=d[k][metric],bx=left+i*band+(band-keys.length*barWidth)/2+j*barWidth,by=y(val);s+='<rect x="'+bx+'" y="'+by+'" width="'+(barWidth-3)+'" height="'+(bottom-by)+'" rx="3" fill="'+colors[k]+'"><title>'+names[k]+' · '+d.month+': '+val+(metric==="conversion"?"%":"")+'</title></rect>'}));
 }else{
  keys.forEach(k=>{
   const pts=data.map((d,i)=>({x:x(i),y:y(d[k][metric]),v:d[k][metric],m:d.month}));
   const path=pts.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");
   if(type==="area"){const area=path+" L"+pts[pts.length-1].x+" "+bottom+" L"+pts[0].x+" "+bottom+" Z";s+='<path d="'+area+'" fill="'+colors[k]+'" opacity=".12"/>'}
   if(type!=="scatter")s+='<path d="'+path+'" fill="none" stroke="'+colors[k]+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
   pts.forEach(p=>{const r=type==="scatter"?5:4;s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+colors[k]+'" stroke="#fff" stroke-width="2"><title>'+names[k]+' · '+p.m+': '+p.v+(metric==="conversion"?"%":"")+'</title></circle>'});
  });
 }
 data.forEach((d,i)=>{const xx=type==="bar"?left+i*band+band/2:x(i);s+='<text x="'+xx+'" y="'+(bottom+24)+'" text-anchor="middle" fill="#73858d" font-size="11">'+d.month+'</text>'});
 s+='</svg>';document.getElementById("chart").innerHTML=s;
 document.getElementById("legend").innerHTML=keys.map(k=>'<span><i class="swatch" style="background:'+colors[k]+'"></i>'+names[k]+'</span>').join("");
 document.getElementById("monthsLabel").textContent=count+" months";
}
[typeEl,metricEl,regionEl,monthsEl].forEach(el=>el.addEventListener("input",render));
render();
</script>
</body>
</html>
